<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;color:#fff0d2;background:#121b20}
body{margin:0;min-height:100svh;padding:clamp(16px,5vw,34px) 12px 24px;background:radial-gradient(ellipse at 50% 15%,#3e3123,transparent 60%),#121b20}

p{margin:0}

.brand{margin:0 0 5px;color:#8a3e29;font-size:clamp(.68rem,2.7vw,.84rem);font-weight:850;letter-spacing:.14em}

.tray{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}

<script>
// 在這裡設定三組折扣碼與各自的蝦皮活動網址。
// 先暫放已知的折扣碼在蝦米。若三組共用網址，三個 url 填同一個即可。
const coupons = {
  shrimp:      { code: "SH18SMPV", url: "" },
  mushroom: { code: "", url: "" },
  pork:     { code: "", url: "" },
  shallot:   null // 彩蛋，沒有折扣碼，也不會跳頁
};

const feedback = document.querySelector("#feedback");
const dishes = document.querySelectorAll(".dish");
let busy = false;

async function copyCode(code) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(code);
      return true;
    } catch (err) {}
  }

  // 部分 App 內建瀏覽器不支援 Clipboard API，改試相容寫法。
  const previousFocus = document.activeElement;
  const field = document.createElement("textarea");
  field.value = code;
  field.readOnly = true;
  field.tabIndex = -1;
  field.setAttribute("aria-label", "暫存折扣碼");
  field.style.cssText = "position:fixed;left:0;top:0;opacity:0;pointer-events:none;font-size:16px";
  document.body.append(field);
  try {
    field.focus({ preventScroll: true });
    field.select();
    field.setSelectionRange(0, field.value.length);
    return document.execCommand("copy");
  } catch (err) {
    return false;
  } finally {
    field.remove();
    previousFocus?.focus({ preventScroll: true });
  }
}

for (const dish of dishes) {
  dish.addEventListener("animationend", () => dish.classList.remove("miss"));
  dish.addEventListener("click", async () => {
    if (busy) return;
    const coupon = coupons[dish.dataset.dish];

    if (!coupon) {
      feedback.textContent = "這口是版主偷吃的，再挑一樣！";
      dish.classList.remove("miss");
      void dish.offsetWidth;
      dish.classList.add("miss");
      return;
    }

    let destination;
    try {
      destination = new URL(coupon.url);
      if (destination.protocol !== "https:") throw new Error("需要 HTTPS 網址");
    } catch (err) {
      feedback.textContent = "這份配料的折扣還沒上桌，先試試別種吧。";
      return;
    }
    if (!coupon.code.trim()) {
      feedback.textContent = "這份配料的折扣還沒上桌，先試試別種吧。";
      return;
    }

    busy = true;
    if (!(await copyCode(coupon.code.trim()))) {
      feedback.textContent = "瀏覽器沒有允許複製。請再點一次，或用 Safari／Chrome 開啟。";
      busy = false;
      return;
    }

    dish.classList.add("hit");
    feedback.textContent = "加菜成功！已複製折扣碼，前往蝦皮。";
    window.location.assign(destination.href);
  });
}

window.addEventListener("pageshow", (event) => {
  if (!event.persisted) return;
