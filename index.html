<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2d193c"><title>油飯DD｜深夜扭蛋機</title>
<style>
*{box-sizing:border-box}html{background:#24152f}body{margin:0;min-height:100vh;color:#fff2cf;background:radial-gradient(ellipse at 50% 34%,#56305a 0,#291936 75%,#211428 100%);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{width:min(100%,540px);margin:0 auto;padding:0 0 38px;text-align:center}.machine{width:100%;aspect-ratio:1024/1300;position:relative;overflow:hidden;isolation:isolate}.art{position:absolute;inset:0;width:100%;height:auto;display:block;pointer-events:none;user-select:none}
.pick,.spin{position:absolute;border:0;appearance:none;cursor:pointer;touch-action:manipulation;background:transparent;transform:translate(-50%,-50%);border-radius:50%;-webkit-tap-highlight-color:transparent}.pick{width:21.5%;aspect-ratio:1;z-index:2}.pick:focus-visible,.spin:focus-visible{outline:4px dashed #fff5ab;outline-offset:5px}.pick:hover{filter:brightness(1.1)}.pick:active{scale:.94}.rose{left:36.5%;top:49.6%}.gold{left:63%;top:49.7%}.mint{left:36.5%;top:64.1%}.blue{left:63%;top:64%}.spin{left:34.5%;top:84%;width:23%;aspect-ratio:1;z-index:2}
/* 蓋住插畫原本固定的「已複製」，由程式依實際開獎結果顯示 */
.ticket{position:absolute;z-index:3;left:53%;top:82.6%;width:22%;height:6.7%;display:flex;justify-content:center;align-items:center;transform:rotate(-2deg);background:#fff1bb;color:#ae3860;border:2px dashed #d77490;border-radius:5px;font-size:clamp(10px,2.35vw,16px);font-weight:900;box-shadow:0 2px 5px #42203870;pointer-events:none;white-space:nowrap}
.machine.opening .ticket{color:#8d5c62}.machine.success .ticket{animation:ticketPop .6s cubic-bezier(.2,1.7,.3,1)}.machine.shaking .selected{animation:wobble .38s ease-in-out infinite alternate}.machine.shaking .art{animation:glow 1s ease-in-out infinite alternate}
.burst{pointer-events:none;position:absolute;z-index:4;width:26%;aspect-ratio:1;left:var(--bx,50%);top:var(--by,53%);transform:translate(-50%,-50%);opacity:0;border:5px solid #fff5a9;border-radius:50%;box-shadow:0 0 20px #ffde64}.machine.revealed .burst{animation:burst .9s ease-out forwards}
@keyframes wobble{0%{transform:translate(-50%,-50%) rotate(-9deg) scale(.99)}100%{transform:translate(-50%,-50%) rotate(9deg) scale(1.06)}}@keyframes glow{to{filter:brightness(1.12)}}@keyframes burst{0%{opacity:1;scale:.5}100%{opacity:0;scale:1.7}}@keyframes ticketPop{0%{scale:.6}70%{scale:1.1}100%{scale:1}}
.status{margin:-1.5% 4.5% 0;padding:17px 12px 16px;min-height:93px;border:2px solid #f5d982;border-radius:18px;background:linear-gradient(135deg,#493047,#30223d);box-shadow:0 7px 16px #160e2470;position:relative;z-index:5}.status strong{display:block;font-size:clamp(18px,4.6vw,24px);line-height:1.4;color:#ffe6a0}.status small{display:block;margin-top:6px;font-size:clamp(12px,3.1vw,15px);line-height:1.5;color:#fff3e7}.hint{margin:15px 14px 0;font-size:clamp(12px,3vw,14px);color:#d9c7e0}.machine.shaking .pick:not(.selected){opacity:.7}
/* 多階段開獎：聚光 → 掉球 → 彈跳 → 扭蛋打開 → 公布 */
.capsule-stage{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.capsule-fly{--cap-top:#f782ae;--cap-bottom:#c94b88;position:absolute;width:22%;aspect-ratio:1;left:var(--from-x,36.5%);top:var(--from-y,49.6%);transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 8px 9px #2a102880);opacity:0}
.capsule-fly .half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;border:3px solid #fff0bc;background:var(--cap-top);box-shadow:inset -9px -7px 13px #732c5b50}
.capsule-fly .top-half{top:0;border-radius:100px 100px 0 0;border-bottom:2px solid #fff7cc;transform-origin:50% 100%}
.capsule-fly .bottom-half{top:50%;background:var(--cap-bottom);border-radius:0 0 100px 100px;border-top:2px solid #fff7cc;transform-origin:50% 0}
.capsule-fly .top-half::before{content:"";position:absolute;top:15%;left:20%;width:33%;height:23%;border-radius:100%;background:#ffffff9c;transform:rotate(-30deg)}
.capsule-fly .seal{position:absolute;z-index:2;left:43%;top:43%;width:14%;height:14%;background:#fff3bf;border:2px solid #e7b45d;border-radius:50%}
.capsule-fly .star{position:absolute;z-index:2;left:29%;top:20%;width:42%;height:42%;background:#fff4ba;clip-path:polygon(50% 0,63% 34%,100% 35%,71% 58%,81% 100%,50% 77%,18% 100%,29% 58%,0 35%,37% 34%)}
.machine.animating .capsule-fly{opacity:1;animation:capsuleJourney 3.5s both cubic-bezier(.2,.75,.3,1)}
.machine.animating .capsule-fly .top-half{animation:topOpen 3.5s ease-in-out both}
.machine.animating .capsule-fly .bottom-half{animation:bottomOpen 3.5s ease-in-out both}
.machine.animating .capsule-fly .seal{animation:sealFade 3.5s linear both}
.machine.animating .capsule-fly .star{animation:sealFade 3.5s linear both}
@keyframes capsuleJourney{0%{left:var(--from-x);top:var(--from-y);transform:translate(-50%,-50%) scale(.78) rotate(-10deg);opacity:0}8%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(10deg)}18%{transform:translate(-50%,-50%) scale(1.05) rotate(-16deg)}29%{left:var(--from-x);top:var(--from-y);transform:translate(-50%,-50%) scale(1.13) rotate(14deg)}43%{left:50%;top:69%;transform:translate(-50%,-50%) scale(.97) rotate(100deg)}57%{left:63%;top:78%;transform:translate(-50%,-50%) scale(1.03) rotate(230deg)}69%{left:62%;top:82%;transform:translate(-50%,-50%) scale(.85) rotate(340deg)}76%{left:62%;top:77%;transform:translate(-50%,-50%) scale(.94) rotate(360deg)}85%{left:62%;top:80%;transform:translate(-50%,-50%) scale(1) rotate(360deg)}98%{left:62%;top:80%;transform:translate(-50%,-50%) scale(1.12) rotate(360deg)}100%{left:62%;top:80%;transform:translate(-50%,-50%) scale(1.12) rotate(360deg)}}
@keyframes topOpen{0%,82%{transform:translate(0,0) rotate(0)}100%{transform:translate(-15%,-48%) rotate(-33deg)}}
@keyframes bottomOpen{0%,82%{transform:translate(0,0) rotate(0)}100%{transform:translate(13%,34%) rotate(25deg)}}
@keyframes sealFade{0%,82%{opacity:1}90%,100%{opacity:0}}
.machine.animating .spin{animation:spinKnob .9s ease-in-out}
@keyframes spinKnob{to{rotate:360deg}}
.machine.animating .selected{animation:wobble .23s ease-in-out infinite alternate}
.machine.animating .art{animation:none}
.machine.animating .status{opacity:1}
.machine.revealed .capsule-fly{opacity:0}
.machine.revealed .burst{animation:burst .9s ease-out forwards}
@media(prefers-reduced-motion:reduce){.machine.animating .capsule-fly,.machine.animating .capsule-fly .half,.machine.animating .capsule-fly .seal,.machine.animating .capsule-fly .star{animation:none!important;opacity:0!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main>

<button class="pick rose" data-id="rose" aria-label="開粉紅色扭蛋"></button>
<button class="pick gold" data-id="gold" aria-label="開金黃色扭蛋"></button>
<button class="pick mint" data-id="mint" aria-label="開薄荷綠扭蛋"></button>
<button class="pick blue" data-id="blue" aria-label="開藍紫色扭蛋"></button>
<button class="spin" id="spin" aria-label="轉動旋鈕，隨機抽一顆扭蛋"></button>
<div class="capsule-stage" aria-hidden="true"><div class="capsule-fly" id="capsuleFly"><div class="half top-half"></div><div class="half bottom-half"></div><div class="star"></div><div class="seal"></div></div></div>
<div class="ticket" id="ticket" aria-live="polite">等你來扭</div><div class="burst"></div>
</div>
<section class="status" id="status" aria-live="polite" aria-atomic="true"><strong id="headline">今天的幸運扭蛋，等你來抽！</strong><small id="detail">點一顆扭蛋，或轉動金色旋鈕試試手氣。</small></section>
<p class="hint">三顆藏折扣碼、一顆空蛋。抽中自動複製，開獎後前往蝦皮。</p>
</main><script>
// ===== 折扣碼與網址：沿用之前 HTML 的設定 =====
const coupons = {
  rose: {code:'7FFG2DBNE',url:'https://s.shopee.tw/6AmrpONJGv'},
  gold: {code:'M8TRK66XL',url:'https://s.shopee.tw/6AmrpONJGv'},
  mint: {code:'49SPNVHDF',url:'https://s.shopee.tw/6AmrpONJGv'},
  blue: null // 空蛋，不會複製或跳轉
};
// ===== 在這裡改秒數：1000 = 1 秒 =====
const REVEAL_DELAY_MS = 3500; // 完整扭蛋開獎動畫 3.5 秒（改動時請同步調整 CSS 內的 3.5s）
const REDIRECT_DELAY_MS = 3000; // 公布中獎後再停留 3 秒跳蝦皮

const machine=document.getElementById('machine');
const headline=document.getElementById('headline');
const detail=document.getElementById('detail');
const ticket=document.getElementById('ticket');
const balls=Array.from(document.querySelectorAll('.pick'));
const capsuleFly=document.getElementById('capsuleFly');
let generation=0,revealTimer=null,redirectTimer=null;
function clearRun(){generation++;clearTimeout(revealTimer);clearTimeout(redirectTimer);balls.forEach(b=>b.classList.remove('selected'));machine.classList.remove('opening','shaking','animating','revealed','success');return generation}
function setMessage(title,sub,label){headline.textContent=title;detail.textContent=sub;ticket.textContent=label}
function copyImmediately(code){
  const area=document.createElement('textarea');area.value=code;area.readOnly=true;area.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;font-size:16px';document.body.appendChild(area);
  let ok=false;try{area.focus({preventScroll:true});area.select();area.setSelectionRange(0,code.length);ok=document.execCommand('copy')}catch(e){}finally{area.remove()}
  if(ok)return Promise.resolve(true);
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(code).then(()=>true).catch(()=>false);
  return Promise.resolve(false)
}
function choose(ball){
  const current=clearRun();const active=()=>current===generation;
  ball.classList.add('selected');
  const positions={rose:['36.5%','49.6%','#f782ae','#c94b88'],gold:['63%','49.7%','#ffd67d','#e69f36'],mint:['36.5%','64.1%','#90e1cf','#35aa9e'],blue:['63%','64%','#b4baff','#6776c8']};
  const [fromX,fromY,topColor,bottomColor]=positions[ball.dataset.id];
  capsuleFly.style.setProperty('--from-x',fromX);capsuleFly.style.setProperty('--from-y',fromY);
  capsuleFly.style.setProperty('--cap-top',topColor);capsuleFly.style.setProperty('--cap-bottom',bottomColor);
  machine.classList.add('opening','shaking','animating');
  machine.style.setProperty('--bx',getComputedStyle(ball).left);machine.style.setProperty('--by',getComputedStyle(ball).top);
  setMessage('正在開啟幸運扭蛋……','扭蛋滾動、落下，打開後才會公布結果！','開獎中…');
  const reward=coupons[ball.dataset.id];let target=null;
  try{if(reward){target=new URL(reward.url);if(target.protocol!=='https:'||!reward.code?.trim())target=null}}catch(e){}
  // 必須在點擊時複製，iPhone Safari 才能正常取得剪貼簿權限；畫面仍延遲公布。
  const copiedPromise=reward&&target?copyImmediately(reward.code.trim()):Promise.resolve(false);
  revealTimer=setTimeout(async()=>{
    if(!active())return;
    machine.classList.remove('opening','shaking','animating');machine.classList.add('revealed');
    if(!reward){setMessage('笑死!這顆是空蛋！','沒抽中，再選另一顆扭蛋試試手氣。','再接再厲');return}
    if(!target){setMessage('這顆暫時無法領券','折扣碼或蝦皮網址尚未設定完成。','未開放');return}
    const copied=await copiedPromise;if(!active())return;
    if(!copied){setMessage('抽中折扣碼，但複製失敗','請再按一次，建議用 Safari 或 Chrome 開啟。','重試一次');return}
    machine.classList.add('success');setMessage('恭喜抽中折扣碼！','已複製成功，即將前往蝦皮使用！','已複製！');
    redirectTimer=setTimeout(()=>{if(active())window.location.assign(target.href)},REDIRECT_DELAY_MS);
  },REVEAL_DELAY_MS)
}
balls.forEach(ball=>ball.addEventListener('click',()=>choose(ball)));
document.getElementById('spin').addEventListener('click',()=>choose(balls[Math.floor(Math.random()*balls.length)]));
window.addEventListener('pagehide',clearRun);
window.addEventListener('pageshow',()=>{clearRun();setMessage('今天的幸運扭蛋，等你來抽！','點一顆扭蛋，或轉動金色旋鈕試試手氣。','等你來扭')});
</script></body></html>
